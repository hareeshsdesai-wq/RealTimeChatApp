<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatify — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: rgba(255,255,255,0.07);
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --green: #22d3a5;
      --text: #f0f0ff;
      --muted: #6b6b8a;
      --danger: #f87171;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(108,99,255,0.18) 0%, transparent 70%);
      top: -150px; left: -150px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(34,211,165,0.12) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px;
      width: 440px;
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--green));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.8px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: var(--muted); }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }

    #message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      display: none;
    }

    #message.success {
      display: block;
      background: rgba(34,211,165,0.12);
      color: var(--green);
      border: 1px solid rgba(34,211,165,0.25);
    }

    #message.error {
      display: block;
      background: rgba(248,113,113,0.12);
      color: var(--danger);
      border: 1px solid rgba(248,113,113,0.25);
    }

    .footer-link {
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .footer-link a {
      color: var(--accent2);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-link a:hover { text-decoration: underline; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }

    @media (max-width: 480px) {
      .card {
        width: 100vw;
        min-height: 100vh;
        border-radius: 0;
        padding: 40px 24px;
        border: none;
      }
      body::before, body::after { display: none; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-icon">💬</div>
    <span class="brand-name">Chatify</span>
  </div>

  <h1>Create account</h1>
  <p class="subtitle">Start chatting with people around you</p>

  <div class="field">
    <label>Username</label>
    <input type="text" id="username" placeholder="Choose a username" autocomplete="off">
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Create a password">
  </div>

  <button class="btn" id="registerBtn">Create Account</button>

  <div id="message"></div>

  <div class="divider"></div>

  <p class="footer-link">Already have an account? <a href="login.html">Sign in</a></p>
</div>

<script>
  const btn = document.getElementById('registerBtn');
  const msg = document.getElementById('message');

  btn.addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      showMsg('Please fill in all fields.', 'error');
      return;
    }

    btn.textContent = 'Creating account…';

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.message === 'Registration successful') {
        showMsg('✓ Account created! Redirecting…', 'success');
        setTimeout(() => window.location.href = 'login.html', 1500);
      } else {
        showMsg(data.message || 'Something went wrong.', 'error');
        btn.textContent = 'Create Account';
      }
    } catch (e) {
      showMsg('Cannot reach server. Is it running?', 'error');
      btn.textContent = 'Create Account';
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') btn.click();
  });

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = type;
  }
</script>
</body>
</html>
